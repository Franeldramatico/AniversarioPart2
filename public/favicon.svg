<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="100%" stop-color="#8b2020" />
    </radialGradient>
  </defs>
  <!-- Beautiful gothic style heart/rose shield -->
  <rect width="100" height="100" rx="20" fill="#0a0a0f" />
  <rect width="90" height="90" x="5" y="5" rx="15" fill="none" stroke="#b89232" stroke-width="2" opacity="0.3" />
  <!-- Heart outline -->
  <path d="M50,80 C50,80 20,55 20,35 C20,20 35,15 50,30 C65,15 80,20 80,35 C80,55 50,80 50,80 Z" fill="url(#grad)" />
  <!-- Rose symbol in center -->
  <text x="50" y="52" font-size="28" text-anchor="middle" fill="#faeab0" font-family="serif">🌹</text>
</svg>
